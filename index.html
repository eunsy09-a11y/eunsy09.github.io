<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대학 입시 지도 · 전국 4년제 대학</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 헤더 -->
    <header class="topbar">
      <div class="logo">대학 입시 <span>지도</span></div>
      <div class="subtitle">전국 4년제 대학 · 입시전형 · 등급컷 · 등급 변환기</div>
      <div class="grow"></div>
      <div class="badge">⚠️ 등급컷·전형 수치는 참고용 예시 데이터</div>
    </header>

    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="search">
        <input id="search" type="text" placeholder="🔍 대학명 · 학과 검색 (예: 컴퓨터, 의예)" />
      </div>
      <div class="filter-row" id="filterRow"></div>
      <div class="uni-list" id="uniList"></div>
    </aside>

    <!-- 지도 -->
    <main class="map-wrap">
      <div id="map"></div>
      <div class="map-legend">
        <div class="row"><span class="legend-dot" style="background:#ff6b7a"></span><b>최상위권</b></div>
        <div class="row"><span class="legend-dot" style="background:#ffb454"></span><b>상위권</b></div>
        <div class="row"><span class="legend-dot" style="background:#4f8cff"></span><b>중상위권</b></div>
        <div class="row"><span class="legend-dot" style="background:#37c2a3"></span><b>중위권</b></div>
        <div class="row"><span class="legend-dot" style="background:#a78bfa"></span><b>중하위권</b></div>
        <div class="row hint">🖱 휠로 확대 · 드래그로 이동</div>
      </div>

      <!-- 비교하기 바 -->
      <div class="compare-bar" id="compareBar"></div>

      <!-- 상세 패널 -->
      <section class="detail" id="detail">
        <div class="detail-head">
          <button class="close" id="detailClose">✕</button>
          <div class="head-row">
            <div class="badge-lg" id="dBadge">서</div>
            <div>
              <h2 id="dName">대학명</h2>
              <div class="tags" id="dTags"></div>
            </div>
          </div>
          <div class="detail-actions" id="dActions"></div>
        </div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="admission">입시전형</button>
          <button class="tab-btn" data-tab="majors">학과</button>
          <button class="tab-btn" data-tab="cuts">등급컷</button>
          <button class="tab-btn" data-tab="convert">등급변환</button>
        </div>
        <div class="tab-content">
          <div class="tab-pane active" id="pane-admission"></div>
          <div class="tab-pane" id="pane-majors"></div>
          <div class="tab-pane" id="pane-cuts"></div>
          <div class="tab-pane" id="pane-convert"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 비교 모달 -->
  <div class="cmp-modal" id="compareModal"></div>

  <script src="data.js"></script>
  <script src="korea-geo.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
